[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lauvinglau-aiefficiency_jd127"
version = "0.1.0"
description = "解析时间标记，排列AI 工程效率工具工程师·奖励模型的过拟合的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lauvinglau" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lauvinglau.github.io"
Repository = "https://github.com/lauvinglau/aiefficiency_jd127"
Issues = "https://github.com/lauvinglau/aiefficiency_jd127/issues"

[project.scripts]
aiefficiency_jd127 = "aiefficiency_jd127:main"

[tool.setuptools]
py-modules = ["aiefficiency_jd127"]
